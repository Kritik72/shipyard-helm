appEnv: dev

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 192Mi
  
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  certificateArn: ""
  group-name: shipyard-dev
  host: ""
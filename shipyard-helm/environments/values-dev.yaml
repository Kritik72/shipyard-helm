appEnv: dev

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 192Mi
  
autoscaling:
  enabled: false        # keeps the replicas line active until you add hpa.yaml
topologySpread:
  enabled: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000       # required: see the note below
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

ingress:
  enabled: false        # until the AWS Load Balancer Controller is installed  # until metrics-server is installed

podDisruptionBudget:
  enabled: false     